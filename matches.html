<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Matches | SkillSwap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="matches">
<div id="navbar"></div>

<div class="container my-4">
  <h2 class="fw-bold text-center mb-3">Find Your Skill Partner</h2>
  <div class="row justify-content-center mb-3"><div class="col-md-6">
    <div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span>
    <input type="text" id="searchInput" class="form-control" placeholder="Search Skill (e.g. Python, React)"></div>
  </div></div>
  <div id="alertBox"></div><div class="alert alert-info py-2"><i class="bi bi-info-circle"></i> Choose a partner, check their availability, then book a learning session.</div>
  <div class="row g-4" id="matchList"></div>
  <p id="noResult" class="text-center text-muted d-none mt-4">No students found for that skill.</p>
</div>
<footer class="text-center py-3 mt-5 small text-muted">&copy; 2026 SkillSwap &ndash; Student Skill Exchange Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
