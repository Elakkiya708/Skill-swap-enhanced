<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | SkillSwap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="chat">
<div id="navbar"></div>

<div class="container my-4">
  <div class="card shadow-sm chat-card"><div class="row g-0 h-100">
    <div class="col-4 col-md-3 border-end"><div class="p-3 fw-bold border-bottom">Students</div><div id="contactList" class="list-group list-group-flush"></div></div>
    <div class="col-8 col-md-9 d-flex flex-column">
      <div class="p-3 fw-bold border-bottom" id="chatTitle">Chat with Arun Kumar</div>
      <div id="chatBox" class="chat-box flex-grow-1 p-3"></div>
      <div class="p-3 border-top"><div class="input-group">
        <input type="text" id="msgInput" class="form-control" placeholder="Type a message...">
        <button class="btn btn-primary" id="sendBtn"><i class="bi bi-send"></i> Send</button>
      </div></div>
    </div>
  </div></div>
</div>
<footer class="text-center py-3 mt-5 small text-muted">&copy; 2026 SkillSwap &ndash; Student Skill Exchange Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
