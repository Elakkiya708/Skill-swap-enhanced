<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | SkillSwap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login">
<div id="navbar"></div>

<div class="container auth-wrap">
  <div class="card auth-card shadow p-4 mx-auto">
    <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
    <p class="text-center text-muted">Login to continue swapping skills</p>
    <form id="loginForm">
      <div class="mb-3"><label class="form-label">College Email</label><input type="email" id="email" class="form-control" placeholder="you@college.edu" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" id="password" class="form-control" placeholder="Enter password" required></div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">New here? <a href="register.html">Register</a></p>
  </div>
</div>
<footer class="text-center py-3 mt-5 small text-muted">&copy; 2026 SkillSwap &ndash; Student Skill Exchange Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
