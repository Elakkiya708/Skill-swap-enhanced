<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | SkillSwap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="register">
<div id="navbar"></div>

<div class="container auth-wrap">
  <div class="card auth-card shadow p-4 mx-auto">
    <h3 class="fw-bold text-center mb-1">Create Account</h3>
    <p class="text-center text-muted">Join the student skill community</p>
    <div id="alertBox"></div>
    <form id="registerForm">
      <div class="mb-3"><label class="form-label">Student Name</label><input type="text" id="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">College Email</label><input type="email" id="email" class="form-control" required></div>
      <div class="row">
        <div class="col-md-7 mb-3"><label class="form-label">Department</label>
          <select id="dept" class="form-select" required><option value="">Select</option><option>Information Technology</option><option>Computer Science</option><option>AI &amp; Data Science</option><option>Electronics</option><option>Mechanical</option></select></div>
        <div class="col-md-5 mb-3"><label class="form-label">Year</label>
          <select id="year" class="form-select" required><option value="">Select</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div>
      </div>
      <div class="mb-3"><label class="form-label">Password</label><input type="password" id="password" class="form-control" minlength="4" required></div>
      <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" id="confirm" class="form-control" required></div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Login</a></p>
  </div>
</div>
<footer class="text-center py-3 mt-5 small text-muted">&copy; 2026 SkillSwap &ndash; Student Skill Exchange Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
