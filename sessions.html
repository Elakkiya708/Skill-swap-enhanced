<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Sessions | SkillSwap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="sessions"><div id="navbar"></div>
<div class="container my-4"><div id="alertBox"></div><h2 class="fw-bold mb-3">Learning Sessions</h2><p class="text-muted">Book, join and complete your SkillSwap learning sessions.</p><div id="sessionList"></div></div>
<div class="modal fade" id="reviewModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Rate & Feedback</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="reviewSessionId"><label class="form-label">Rating</label><select id="rating" class="form-select mb-3"><option value="5">★★★★★ - Excellent</option><option value="4">★★★★ - Very Good</option><option value="3">★★★ - Good</option><option value="2">★★ - Needs Improvement</option><option value="1">★ - Poor</option></select><label class="form-label">Feedback</label><textarea id="feedback" class="form-control" rows="4" placeholder="Share your learning experience..."></textarea></div><div class="modal-footer"><button class="btn btn-primary" id="submitReview" data-bs-dismiss="modal">Submit Feedback</button></div></div></div></div>
<footer class="text-center py-3 mt-5 small text-muted">&copy; 2026 SkillSwap – Student Skill Exchange Platform</footer><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
