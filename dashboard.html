<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | SkillSwap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">
<div id="navbar"></div>

<div class="container my-4">
  <h2 class="fw-bold mb-1">Welcome, <span id="userName">Miruthula</span> 👋</h2>
  <p class="text-muted">Here is your SkillSwap overview.</p>
  <div class="row g-3 mb-4">
    <div class="col-md-6 col-lg-3"><div class="card stat-card h-100 p-3"><h6 class="text-muted"><i class="bi bi-lightbulb"></i> My Skills</h6><div><span class="badge bg-primary">HTML</span> <span class="badge bg-primary">CSS</span> <span class="badge bg-primary">JavaScript</span></div></div></div>
    <div class="col-md-6 col-lg-3"><div class="card stat-card h-100 p-3"><h6 class="text-muted"><i class="bi bi-book"></i> Skills I Want</h6><div><span class="badge bg-success">Python</span> <span class="badge bg-success">Machine Learning</span></div></div></div>
    <div class="col-md-6 col-lg-3"><div class="card stat-card h-100 p-3"><h6 class="text-muted"><i class="bi bi-people"></i> Available Matches</h6><h3 class="fw-bold mb-0">5 Students</h3></div></div>
    <div class="col-md-6 col-lg-3"><div class="card stat-card h-100 p-3"><h6 class="text-muted"><i class="bi bi-hourglass-split"></i> Pending Requests</h6><h3 class="fw-bold mb-0">2</h3></div></div>
  </div>
  <h4 class="fw-bold mb-3">Recommended Students</h4>
  <div class="row g-4" id="recommended"></div>
</div>
<footer class="text-center py-3 mt-5 small text-muted">&copy; 2026 SkillSwap &ndash; Student Skill Exchange Platform</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
